name: bots-quotidien

on:
  schedule:
    - cron: '10 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python bot.py
      - name: Sauvegarde des résultats
        run: |
          git config user.name "bots-survie"
          git config user.email "bots-survie@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "maj quotidienne" && git push)
          
